[project]
name = "shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "cohere>=5.18.0",
    "httpx>=0.27.0",
    "langchain>=1.1.0",
    "langchain-openai>=0.3.35",
    "langgraph>=1.2.0",
    "pydantic-settings>=2.11.0",
    "pymilvus>=2.6.2",
    "redis>=6.4.0",
    "tavily-python>=0.7.12",
    "cryptography>=48.0.1",
    "google-api-python-client>=2.185.0",
    "google-auth-oauthlib>=1.2.2",
    "html2text>=2025.4.15",
    "aiogoogle>=5.17.0",
    "mem0ai>=1.0.0",
    "pyjwt>=2.13.0",
    "langchain-google-genai>=4.1.1",
    "tools>=1.0.23",
    "toon-format>=0.1.0",
    "python-multipart>=0.0.30",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
