[project]
name = "workflow-service"
version = "0.1.0"
description = "Workflow execution API (scaffold)"
readme = "../../README.md"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "fastapi>=0.133.0",  # >=0.133 lifts the starlette<1.0 cap, needed for starlette>=1.3.1 (GHSA-82w8-qh3p-5jfq, GHSA-wqp7-x3pw-xc5r)
    "uvicorn>=0.37.0",
    "httpx>=0.27.0",
    "opentelemetry-distro[otlp]>=0.55b1",
    "opentelemetry-instrumentation-asyncpg>=0.55b1",
    "opentelemetry-instrumentation-fastapi>=0.64b0",  # 0.64b0 flattens FastAPI 0.137 _IncludedRouter tree; <0.62 crashes on route.path
    "opentelemetry-instrumentation-httpx>=0.55b1",
    "opentelemetry-instrumentation-requests>=0.55b1",
    "pydantic-settings>=2.11.0",
    "aioboto3>=13.0.0",
    "pytest>=9.0.1",
    "temporalio>=1.0.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "respx>=0.23.1",
]
test = [
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
    "pytest-cov>=6.0.0",
    "asyncpg>=0.30.0",
    "freezegun>=1.5.0",
]

[tool.uv.sources]
shared = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring a live database (deselect with -m 'not integration')",
    "worker: marks tests for the SQS worker loop",
]
addopts = "--strict-markers"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workflow_service"]
